version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - npm install -g aws-cdk
      - npm ci
  build:
    commands:
      - npm run build
      - ls -la
      - ls -la lambda/
      - cdk deploy AwsCloudPlatformStack --require-approval never
  post_build:
    commands:
      - echo "Done"
